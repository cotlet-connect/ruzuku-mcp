[project]
name = "ruzuku-mcp"
version = "1.1.0"
description = "Connect Ruzuku to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No Ruzuku API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["ruzuku", "ruzuku api", "ruzuku mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/ruzuku-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=ruzuku"
Source = "https://github.com/cotlet-connect/ruzuku-mcp"

[project.scripts]
ruzuku-mcp = "ruzuku_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"ruzuku_agent.py" = "ruzuku_agent.py"

[tool.hatch.build.targets.sdist]
include = ["ruzuku_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
